<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3346D3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E8EBF1; --surface: #FFFFFF; --sunk: #F2F4F8; --ink: #172036; --muted: #5A6378; --faint: #8C94A6; --line: #D6DBE5;
  --route: #3346D3; --route-ink: #FFFFFF; --route-soft: #E1E5FC;
  --good: #1C7C52; --good-soft: #DCF0E5; --late: #B8283A; --late-soft: #F9E1E4; --amber: #8F5300; --amber-soft: #FBEBD3;
  --shadow: 0 1px 0 rgba(23,32,54,.04), 0 8px 24px -12px rgba(23,32,54,.18);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F121A; --surface: #181C27; --sunk: #121620; --ink: #E7EAF3; --muted: #A0A8BA; --faint: #6E768A; --line: #2A3041;
    --route: #8D99FF; --route-ink: #0F121A; --route-soft: #262C4D;
    --good: #57C892; --good-soft: #17322A; --late: #FF7383; --late-soft: #3A1C24; --amber: #F0B35A; --amber-soft: #36290F;
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F121A; --surface: #181C27; --sunk: #121620; --ink: #E7EAF3; --muted: #A0A8BA; --faint: #6E768A; --line: #2A3041;
  --route: #8D99FF; --route-ink: #0F121A; --route-soft: #262C4D;
  --good: #57C892; --good-soft: #17322A; --late: #FF7383; --late-soft: #3A1C24; --amber: #F0B35A; --amber-soft: #36290F;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 400 16px/1.45 "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  font-variation-settings: "opsz" 14;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Frame ---------- */
.app { max-width: 1080px; margin: 0 auto; padding: 14px 18px 120px; }
.top { display: flex; align-items: center; gap: 12px; padding: 4px 0 10px; }
.brand { font-size: 22px; font-weight: 700; font-variation-settings: "opsz" 48, "wdth" 85; letter-spacing: -0.02em; margin: 0; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--route); position: relative; }
.brand-mark::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--route); }
.sync { font-size: 13px; color: var(--faint); background: none; border: 0; padding: 4px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.add-btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px 0 14px; border-radius: 21px; border: 0; background: var(--route); color: var(--route-ink); font-weight: 600; }
.add-btn svg { width: 18px; height: 18px; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin: 4px 0 22px; width: max-content; }
.tabs button { border: 0; background: none; padding: 9px 16px; border-radius: 12px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.tabs button svg { width: 18px; height: 18px; display: none; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

@media (max-width: 720px) {
  .app { padding: 10px 16px 130px; }
  .top .add-btn { display: none; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; width: auto; margin: 0; border-radius: 0; border: 0;
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .tabs button { flex-direction: column; gap: 3px; font-size: 12px; padding: 6px 4px; flex: 1; border-radius: 10px; }
  .tabs button svg { display: block; width: 22px; height: 22px; }
  .tabs button[aria-selected="true"] { background: none; color: var(--route); }
  .fab { display: grid !important; }
}
.fab { display: none; position: fixed; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 21; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--route); color: var(--route-ink); place-items: center; box-shadow: var(--shadow); }
.fab svg { width: 26px; height: 26px; }

/* ---------- Shared pieces ---------- */
.big { white-space: nowrap; font-weight: 650; font-variation-settings: "opsz" 14, "wdth" 100; letter-spacing: -0.02em; line-height: 1; margin: 0; }
.big .p { font-size: .5em; letter-spacing: 0; margin-left: .02em; font-weight: 600; }
.cap { font-size: 15px; color: var(--muted); margin: 0 0 6px; }
.sub { color: var(--muted); font-size: 15px; margin: 10px 0 0; max-width: 46ch; }
.neg { color: var(--late); }
.pos { color: var(--good); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.amt { font-weight: 600; white-space: nowrap; text-align: right; }
h2.h { font-size: 19px; font-weight: 650; font-variation-settings: "opsz" 32, "wdth" 90; letter-spacing: -0.01em; margin: 0 0 4px; }
h3.h { font-size: 16px; font-weight: 650; margin: 0 0 8px; }
.panel { background: var(--surface); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); }
.flat { padding: 4px 2px; }
.rule { border-top: 1px solid var(--line); margin: 16px 0; }
.btn { height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-weight: 550; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--route); border-color: var(--route); color: var(--route-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--route); padding: 0 8px; }
.btn.danger { color: var(--late); }
.btn.small { height: 34px; font-size: 14px; padding: 0 12px; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 11px; font-size: 14px; font-weight: 550; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.late { background: var(--late-soft); color: var(--late); }
.pill.today { background: var(--amber-soft); color: var(--amber); }
.pill.good { background: var(--good-soft); color: var(--good); }
.bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.row:last-child { border-bottom: 0; }
button.row:hover { background: var(--sunk); }
.row .nm { font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mt { font-size: 13.5px; color: var(--muted); grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rt { grid-column: 2; grid-row: 1 / span 2; text-align: right; }
.row .rt small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.empty { padding: 24px 6px; color: var(--muted); }
.sec-head { display: flex; align-items: baseline; gap: 12px; justify-content: space-between; flex-wrap: wrap; margin: 30px 0 10px; }
.sec-head:first-child { margin-top: 0; }

/* ---------- Pay cycle ---------- */
.cycle-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .cycle-grid { grid-template-columns: 1fr; gap: 22px; } }
.hero { padding: 6px 2px 0; }
.hero .big { font-size: clamp(52px, 13vw, 92px); }

.runway { position: relative; height: 54px; margin: 40px 6px 0; }
.runway .line { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.runway .done { position: absolute; left: 0; top: 18px; height: 4px; border-radius: 2px; background: var(--route); }
.runway .dot { position: absolute; top: 13px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--surface); border: 3px solid var(--faint); }
.runway .dot.paid { background: var(--route); border-color: var(--route); }
.runway .dot.late { border-color: var(--late); background: var(--late-soft); }
.runway .now { position: absolute; top: 4px; width: 0; height: 32px; border-left: 2px solid var(--ink); }
.runway .now span { position: absolute; top: -18px; left: 0; transform: translateX(-50%); font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.runway .end { position: absolute; top: 34px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.runway .end.r { right: 0; text-align: right; }
.runway .cap-end { position: absolute; top: 9px; width: 22px; height: 22px; border-radius: 50%; background: var(--route); right: -11px; display: grid; place-items: center; color: var(--route-ink); font-size: 12px; font-weight: 700; }

.callout { display: flex; gap: 12px; align-items: flex-start; background: var(--late-soft); color: var(--ink); border-radius: 16px; padding: 14px 16px; margin-top: 22px; }
.callout b { color: var(--late); }
.callout .btn { margin-left: auto; flex: none; }
.cat-h { display: flex; align-items: center; gap: 10px; margin: 24px 6px 10px; }
.cat-h:first-child { margin-top: 0; }
.cat-h .sw { width: 12px; height: 12px; border-radius: 4px; align-self: center; flex: none; }
.cat-h h3 { margin: 0; }
.cat-h .amt { margin-left: auto; font-size: 17px; }
.cat-h .amt small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.route-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.owed { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--route-soft); color: var(--ink); border: 0; border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
.owed b { display: block; font-weight: 650; }
.owed small { display: block; font-size: 14px; color: var(--muted); }
.owed .go { margin-left: auto; flex: none; background: var(--route); color: var(--route-ink); border-radius: 18px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
.collect-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 15.5px; }
.collect-row input { width: 22px; height: 22px; accent-color: var(--route); }
.collect-row small { display: block; color: var(--muted); font-size: 13.5px; }

.route-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 34px 0 12px; }
.route { list-style: none; margin: 0; padding: 6px 0; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); }
.stop { position: relative; display: grid; grid-template-columns: 58px 26px minmax(0, 1fr) auto 48px; align-items: center; min-height: 52px; padding: 0 10px 0 6px; }
.stop::before { content: ""; position: absolute; left: 76px; top: 0; bottom: 0; width: 3px; background: var(--route-soft); }
.stop:first-child::before { top: 50%; }
.stop:last-child::before { bottom: 50%; }
.stop .date { font-size: 13.5px; color: var(--muted); text-align: right; padding-right: 12px; line-height: 1.15; }
.stop .date b { display: block; font-size: 18px; color: var(--ink); font-weight: 650; font-variation-settings: "opsz" 14, "wdth" 100; }
.cat-chip { display: inline-flex; align-items: center; gap: 5px; flex: none; color: var(--ink); font-weight: 550; font-size: 12.5px; padding: 1px 8px 1px 6px; border-radius: 10px; }
.cat-chip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.stop .node { position: relative; z-index: 1; justify-self: center; width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--route); }
.stop.paid .node { background: var(--route); }
.stop.late .node { border-color: var(--late); background: var(--late-soft); }
.stop .body { min-width: 0; padding: 10px 10px 10px 8px; background: none; border: 0; text-align: left; border-radius: 12px; display: flex; align-items: center; gap: 8px; }
.stop .body .pill { flex: none; font-size: 11.5px; padding: 1px 7px; }
.stop .body { position: relative; }
.stop .body[data-tip]::after { content: attr(data-tip); position: absolute; left: 8px; top: calc(100% - 2px); z-index: 30; min-width: 180px; max-width: 300px; padding: 9px 12px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 450; line-height: 1.45; white-space: pre-line; box-shadow: var(--shadow); pointer-events: none; opacity: 0; transform: translateY(-4px); transition: opacity .12s ease, transform .12s ease; visibility: hidden; }
@media (hover: hover) { .stop .body[data-tip]:hover::after { opacity: 1; transform: none; visibility: visible; transition-delay: .25s; } }
.stop .body[data-tip]:focus-visible::after { opacity: 1; transform: none; visibility: visible; }
.mini-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 6px 10px; font-size: 13px; color: var(--muted); }
.mini-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mini-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.stop .body:hover { background: var(--sunk); }
.stop .nm { font-weight: 560; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
.stop .mt { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; overflow: hidden; white-space: nowrap; }
.stop .mt > span { overflow: hidden; text-overflow: ellipsis; }
.stop .amt { padding-left: 8px; }
.stop.paid .nm, .stop.paid .amt, .stop.assumed .nm, .stop.assumed .amt { color: var(--muted); }
.stop.assumed .node { border-color: var(--route); background: var(--route-soft); }
.stop.paid .amt { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--faint); }
.tick { justify-self: end; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; }
.tick:hover { border-color: var(--route); color: var(--route); }
.tick svg { width: 18px; height: 18px; }
@media (max-width: 520px) {
  .stop { grid-template-columns: 44px 22px minmax(0, 1fr) auto 42px; padding: 0 8px 0 2px; }
  .stop::before { left: 55px; }
  .stop .date b { font-size: 16px; }
  .stop .date { padding-right: 8px; font-size: 12.5px; }
  .stop .body { padding: 9px 6px; }
  .stop .amt { font-size: 15px; }
  .stop.marker .lbl, .stop.group .lbl { padding-left: 6px; }
  .stop.group .lbl { flex-wrap: wrap; gap: 6px; }
}
.stop.paid .tick { background: var(--route); border-color: var(--route); color: var(--route-ink); }
.stop.marker { min-height: 46px; }
.stop.marker .node { width: 21px; height: 21px; background: var(--ink); border: 4px solid var(--bg); box-shadow: 0 0 0 2px var(--ink); }
.stop.marker .lbl { grid-column: 3 / span 3; font-weight: 650; padding-left: 8px; }
.stop.marker .lbl span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.stop.pay .node { width: 24px; height: 24px; background: var(--route); border: 0; display: grid; place-items: center; color: var(--route-ink); font-size: 13px; font-weight: 700; }
.stop.dayhead { min-height: 46px; }
.stop.dayhead .node { width: 15px; height: 15px; border: 3px solid var(--ink); background: var(--surface); }
.stop.dayhead .lbl { grid-column: 3; padding-left: 8px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.stop.dayhead .lbl span { font-weight: 400; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop.dayhead .amt { grid-column: 4; }
.stop.dayhead .amt small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.stop.inday { min-height: 46px; }
.stop.inday .node { width: 10px; height: 10px; border-width: 2px; }
.stop.daystart:not(:first-child)::after { content: ""; position: absolute; left: 92px; right: 14px; top: 0; height: 1px; background: var(--line); }
@media (max-width: 520px) { .stop.daystart:not(:first-child)::after { left: 68px; } }
.stop.group { min-height: 40px; }
.stop.group .lbl { grid-column: 3 / span 3; justify-content: flex-start; font-size: 14px; color: var(--late); font-weight: 600; padding-left: 8px; display: flex; align-items: center; gap: 10px; }
.stop.group .node { width: 7px; height: 7px; border: 0; background: var(--route-soft); }

.side { display: grid; gap: 22px; }
.plan h2.h { margin-bottom: 14px; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; gap: 10px; }
.sum-line.total { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; font-weight: 650; font-size: 18px; }
.moves { margin-top: 18px; }
.move { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.move .mt { font-size: 13.5px; color: var(--muted); }
.legend { display: grid; gap: 6px; margin-top: 14px; }
.legend div { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14.5px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; }
.inline-select { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--amber-soft); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; margin-top: 14px; }
.inline-select select { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }

/* ---------- Accounts / Debt / Activity ---------- */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
@media (max-width: 880px) { .two { grid-template-columns: 1fr; } }
.lead { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 22px; }
.lead .big { font-size: clamp(46px, 11vw, 76px); }
.util { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.util .bar { grid-column: 1 / -1; height: 6px; }
.stale { color: var(--amber); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 12px; font-family: inherit; }
.ctrl { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; margin: 4px 0 16px; }
.slider { display: flex; align-items: center; gap: 12px; }
.slider input { width: 180px; accent-color: var(--route); }
.payoff-order { counter-reset: n; }
.search { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.search input { flex: 1 1 220px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); padding: 0 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day-h { font-size: 13.5px; color: var(--muted); font-weight: 600; padding: 18px 4px 4px; }

/* ---------- Sheet ---------- */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(540px, 100vw); max-height: min(88vh, 900px); border-radius: 24px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog.sheet::backdrop { background: rgba(10, 14, 26, .45); }
@media (max-width: 600px) {
  dialog.sheet { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: 24px 24px 0 0; max-height: 92vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.sheet-in { padding: 22px 22px 22px; overflow-y: auto; max-height: inherit; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sheet-head h2 { font-size: 22px; font-weight: 650; font-variation-settings: "opsz" 40, "wdth" 88; margin: 0; letter-spacing: -0.01em; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 12px; }
.fields .full { grid-column: 1 / -1; }
.fields label { display: grid; gap: 5px; font-size: 14px; color: var(--muted); font-weight: 500; }
.fields input, .fields select { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); padding: 0 12px; color: var(--ink); font-size: 16px; width: 100%; min-width: 0; }
.fields input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--route); }
.fields .check { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.fields .hint { font-size: 13px; color: var(--faint); font-weight: 400; }
.fields .amount-in { font-size: 30px; height: 64px; font-weight: 650; font-variation-settings: "opsz" 48, "wdth" 85; }
.sheet-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
.sheet-actions .grow { flex: 1; }
.sheet .err { color: var(--late); font-size: 14px; margin: 10px 0 0; min-height: 1em; }
.sheet .row { padding: 12px 2px; }
.sheet .seg { margin-bottom: 16px; display: flex; width: 100%; }
.sheet .seg button { flex: 1; padding: 8px 4px; white-space: nowrap; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 50; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 10px 10px 18px; display: flex; gap: 14px; align-items: center; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); font-size: 15px; }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: none; border: 0; color: var(--route-soft); font-weight: 650; padding: 6px 10px; }
@media (min-width: 721px) { .toast { bottom: 28px; } }

.welcome { max-width: 560px; padding: 30px 4px; }
.welcome .big { font-size: clamp(40px, 9vw, 64px); margin-bottom: 16px; white-space: normal; }
.welcome p { color: var(--muted); font-size: 17px; }
.welcome .sheet-actions { margin-top: 26px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* =====================================================================
   Spreadsheet layout
   Gridlines, a row-number gutter, header cells, totals with an accounting
   double rule. The one loud element is the "active cell" outline on the
   figure that matters most on each tab.
   ===================================================================== */
:root {
  --bg: #ECEEF2; --surface: #FFFFFF; --sunk: #F4F5F8; --head: #EEF0F4; --ink: #1B2130; --muted: #576073; --faint: #8F97A8; --line: #DCE0E7; --line-2: #C9CFD9;
  --route-soft-2: #C9D1FA; --row-hover: #F2F4FE;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --head: #1F2431; --line-2: #394054; --route-soft-2: #3A4380; --row-hover: #1F2538; }
}
:root[data-theme="dark"] { --head: #1F2431; --line-2: #394054; --route-soft-2: #3A4380; --row-hover: #1F2538; }

body { font: 400 15px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-variation-settings: normal; font-variant-numeric: tabular-nums; }
.app { max-width: 1340px; padding: 12px 20px 120px; }
.brand { font-family: "IBM Plex Sans", system-ui, sans-serif; font-variation-settings: normal; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.brand-mark { width: 22px; height: 22px; border-radius: 4px; border: 2px solid var(--route); background:
  linear-gradient(var(--route), var(--route)) 0 50% / 100% 2px no-repeat,
  linear-gradient(var(--route), var(--route)) 50% 0 / 2px 100% no-repeat; }
.brand-mark::after { display: none; }
.add-btn { height: 36px; border-radius: 8px; padding: 0 14px 0 10px; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; }
.icon-btn svg { width: 18px; height: 18px; }

/* Tabs read as sheet tabs on wide screens */
@media (min-width: 721px) {
  .tabs { width: auto; background: none; border: 0; border-bottom: 1px solid var(--line-2); border-radius: 0; padding: 0 0 0 4px; margin: 6px 0 18px; gap: 2px; }
  .tabs button { border-radius: 6px 6px 0 0; padding: 8px 18px; border: 1px solid transparent; border-bottom: 0; margin-bottom: -1px; color: var(--muted); font-weight: 500; }
  .tabs button:hover { background: var(--sunk); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); border-color: var(--line-2); box-shadow: inset 0 2px 0 var(--route); font-weight: 600; }
}

.big { font-weight: 600; letter-spacing: -0.015em; font-variation-settings: normal; }
.big .p { font-size: .62em; font-weight: 500; }
h2.h { font-family: "IBM Plex Sans", system-ui, sans-serif; font-variation-settings: normal; font-size: 16px; font-weight: 600; letter-spacing: 0; margin: 0; }
.btn { height: 32px; border-radius: 7px; font-size: 14px; font-weight: 500; padding: 0 12px; }
.btn.small { height: 30px; font-size: 13.5px; padding: 0 10px; }
.btn.ghost { padding: 0 8px; }
.seg { border-radius: 8px; padding: 2px; }
.seg button { border-radius: 6px; padding: 5px 11px; font-size: 13.5px; font-weight: 500; }
.pill { font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 4px; }
.panel { border-radius: 10px; }
.callout { border-radius: 8px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--late) 30%, transparent); }
.owed { border-radius: 8px; margin-top: 12px; padding: 10px 14px; }
.owed .go { border-radius: 6px; }
.repeat-tip { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.owed.share { background: var(--good-soft); flex-wrap: wrap; }
.owed.share.overdue { background: var(--amber-soft); }
.owed.share > span:first-child { flex: 1 1 260px; min-width: 0; }
.share-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.inline-select { border-radius: 8px; margin-top: 10px; }
.stale { color: var(--amber); }
.empty { padding: 18px 6px; }

/* ---------- Named total cells ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--surface); padding: 10px 14px 11px; display: flex; flex-direction: column; gap: 3px; min-width: 0; position: relative; }
.kpi .k { font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif; font-size: 13px; font-weight: 500; color: var(--muted); }
.kpi .v { font-size: 25px; font-weight: 600; line-height: 1.15; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v .p { font-size: .62em; font-weight: 500; }
.kpi small { font-size: 12.5px; color: var(--muted); min-height: 1em; }
.kpi .dbar { margin-top: 4px; }
.kpi.neg .v { color: var(--late); }
.kpi.pos .v { color: var(--good); }
/* The active cell: outlined like a selected cell, with the fill handle */
.kpi.key { box-shadow: inset 0 0 0 2px var(--route); background: color-mix(in srgb, var(--route-soft) 45%, var(--surface)); }
.kpi.key::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 7px; height: 7px; background: var(--route); border: 1.5px solid var(--surface); }
.kpi.key .v { font-size: 28px; }

/* ---------- Bars above each grid ---------- */
.sheet-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; margin: 24px 0 8px; }
.bar-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint-line { font-size: 13px; color: var(--faint); margin: 8px 2px 0; }
.small-note { font-size: 13px; margin: 0 0 8px; }

/* ---------- Grid ---------- */
.grid-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; -webkit-overflow-scrolling: touch; }
table.grid { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
.grid-wrap table.grid { min-width: 760px; }
.side table.grid, .mini table.grid { min-width: 0; }
table.grid col.c-rn { width: 38px; }
table.grid th, table.grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: middle; }
table.grid tr > :last-child { border-right: 0; }
table.grid tbody tr:last-child td { border-bottom: 0; }
table.grid thead th { background: var(--head); font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; border-bottom: 1px solid var(--line-2); padding: 6px 10px; }
table.grid .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.grid th.num { text-align: right; }
table.grid .rn { background: var(--head); color: var(--faint); font-size: 11.5px; text-align: center; padding: 0 4px; width: 38px; border-right: 1px solid var(--line-2); }
table.grid tbody tr:hover td:not(.rn) { background: var(--row-hover); }
table.grid tbody tr:hover .rn { color: var(--route); font-weight: 600; }
.th-sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
.th-sort:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
th[aria-sort] { color: var(--ink) !important; }
.arr { font-size: 9px; color: var(--route); }
th.num .th-sort { flex-direction: row-reverse; }

.cell-btn { border: 0; background: none; padding: 0; margin: 0; text-align: left; font-weight: 500; color: var(--ink); display: block; max-width: 100%; }
.cell-btn:hover { color: var(--route); }
table.grid td .cell-btn { min-width: 130px; }
.mini table.grid td .cell-btn { min-width: 0; }
.cell-btn small, small.fx { display: block; font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.3; }
.dt { white-space: nowrap; color: var(--muted); }
.dt b { color: var(--ink); font-weight: 600; }
.cat { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: 0; flex: none; }
.cat .sw { margin-right: 0; }
.pct { display: block; font-size: 13px; }
.dbar { display: block; height: 5px; background: var(--sunk); border-radius: 1px; overflow: hidden; margin-top: 3px; min-width: 40px; }
.dbar i { display: block; height: 100%; }

/* Status and the paid checkbox */
.stat { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.tick { width: 22px; height: 22px; border-radius: 4px; border: 1.5px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: transparent; flex: none; }
.tick svg { width: 14px; height: 14px; }
.tick:hover { border-color: var(--route); color: var(--route); }
.tick[aria-pressed="true"] { background: var(--route); border-color: var(--route); color: var(--route-ink); }

/* Row states */
table.grid tr.paid td:not(.rn), table.grid tr.assumed td:not(.rn) { color: var(--muted); }
table.grid tr.paid .cell-btn, table.grid tr.assumed .cell-btn { color: var(--muted); }
table.grid tr.paid .a { text-decoration: line-through; text-decoration-color: var(--faint); }
table.grid tr.late td.rn { background: var(--late); color: #fff; }
table.grid tr.late td:not(.rn) { background: color-mix(in srgb, var(--late-soft) 55%, var(--surface)); }
table.grid tr.today td.rn { background: var(--amber); color: #fff; }
table.grid tr.today td:not(.rn) { background: color-mix(in srgb, var(--amber-soft) 50%, var(--surface)); }
table.grid tr.grp td { background: var(--sunk); padding-top: 9px; padding-bottom: 9px; }
table.grid tr.grp td.rn { background: var(--head); }
table.grid tr.note-row td { background: color-mix(in srgb, var(--route-soft) 35%, var(--surface)); font-style: italic; color: var(--muted); }
table.grid tr.note-row td b { font-style: normal; color: var(--ink); }
table.grid tr.note-row.late td { background: var(--late-soft); color: var(--late); font-style: normal; font-weight: 500; }
table.grid tr.note-row.late .btn { margin-left: 10px; }
table.grid tr.note-row.pay td { font-style: normal; color: var(--ink); background: color-mix(in srgb, var(--route-soft) 60%, var(--surface)); }
table.grid tr.empty-row td { color: var(--muted); padding: 18px 12px; }
table.grid tr.faint-row td { color: var(--muted); }
.nw { white-space: nowrap; }

/* Totals: rule above, accounting double rule under the figures */
table.grid tfoot td { background: var(--head); border-top: 1.5px solid var(--ink); border-bottom: 0; font-weight: 500; }
table.grid tfoot td.num b { border-bottom: 3px double var(--ink); padding-bottom: 1px; }
table.grid tfoot td.num small.fx { margin-top: 3px; }

/* Small side sheets */
.mini { margin-top: 0; min-width: 0; overflow-x: auto; }
.kpis + .mini, .owed + .mini, .callout + .mini { margin-top: 24px; }
.mini .sheet-bar { margin-top: 0; }
.mini > table.grid { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
.mini > table.grid td, .mini > table.grid th { padding: 7px 10px; }
.mini > table.grid tbody tr:last-child td { border-bottom: 1px solid var(--line); }
.chart-box { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; margin-top: 18px; }
.chart-box .sheet-bar { margin: 0 0 6px; }
.chart-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.chart-wrap .chart { height: 200px; width: 100%; display: block; }
.chart-y { display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; color: var(--muted); text-align: right; height: 200px; }
.chart-x { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
.slider { gap: 10px; font-size: 13.5px; color: var(--muted); }
.slider b { color: var(--ink); min-width: 56px; }
.slider input { width: 160px; }

/* Layouts */
.cycle-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.cycle-grid .side { display: grid; gap: 18px; padding-top: 24px; }
@media (max-width: 1180px) { .cycle-grid { grid-template-columns: minmax(0, 1fr); } .cycle-grid .side { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); padding-top: 4px; } }
.two { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 9fr); gap: 22px; align-items: start; }
@media (max-width: 1240px) { .two { grid-template-columns: minmax(0, 1fr); gap: 0; } }
.two > div > .sheet-bar { min-height: 32px; }
.search { margin: 0 0 10px; }
.search input { height: 34px; border-radius: 7px; padding: 0 12px; font-size: 14px; }
.chips button { border-radius: 6px; padding: 4px 10px; font-size: 13px; }

@media (max-width: 720px) {
  .app { padding: 8px 12px 130px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .v { font-size: 21px; }
  .kpi.key { grid-column: 1 / -1; }
  .kpi.key .v { font-size: 26px; }
  .sheet-bar { margin-top: 20px; }
  table.grid { font-size: 13.5px; }
  table.grid th, table.grid td { padding: 6px 8px; }
  .slider input { width: 120px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>Budget</h1>
    <button class="sync" id="sync" data-act="settings"></button>
    <div class="top-actions">
      <button class="add-btn" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
      <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views" id="tabs">
    <button role="tab" data-tab="cycle" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 12h9"/></svg>Pay cycle</button>
    <button role="tab" data-tab="bills" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></svg>Bills</button>
    <button role="tab" data-tab="accounts" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/></svg>Accounts</button>
    <button role="tab" data-tab="debt" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c5 0 7 3 9 7s4 7 7 7"/><path d="M4 19h16"/></svg>Debt</button>
    <button role="tab" data-tab="activity" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Activity</button>
  </nav>

  <main id="main">
    <section id="v-cycle" role="tabpanel"></section>
    <section id="v-bills" role="tabpanel" hidden></section>
    <section id="v-accounts" role="tabpanel" hidden></section>
    <section id="v-debt" role="tabpanel" hidden></section>
    <section id="v-activity" role="tabpanel" hidden></section>
  </main>
</div>
<button class="fab" data-act="add" aria-label="Add a transaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function () {
'use strict';
// =============== Utilities ===============
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = (n) => Math.round((+n || 0) * 100) / 100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, '0');
const dk = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ymOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const pday = (s) => { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const dShort = (d) => d.getDate() + ' ' + MON[d.getMonth()];
const dLong = (d) => DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];

function cyclePicture() {

  const unpaidNow = now.filter((i) => open_(i) && i.kind !== 'in' && !isCard(i.pay));
  const inNowList = now.filter((i) => open_(i) && i.kind === 'in'), inNow = inNowList.reduce((s, i) => s + i.gbp, 0);

  unpaidNow.forEach((i) => { const a = acct[i.pay]; if (a) { const v = fromGbp(a.b.cur || 'GBP', i.gbp); a.after -= v; a.needNow += v; } });
  inNowList.forEach((i) => { const a = acct[i.pay]; if (a) a.after += fromGbp(a.b.cur || 'GBP', i.gbp); });
  next.filter((i) => open_(i) && isBank(i.pay)).forEach((i) => { const a = acct[i.pay]; a.need += (i.kind === 'in' ? -1 : 1) * fromGbp(a.b.cur || 'GBP', i.gbp); });

}

function simulate(extra, strategy) {

    let pool = budget;
    L.forEach((d) => { if (d.b > 0.005) { const p = Math.min(d.min, d.b, pool); d.b -= p; pool -= p; } });
    const order = L.filter((d) => d.b > 0.005).sort(strategy === 'avalanche' ? (a, b) => b.apr - a.apr || a.b - b.b : (a, b) => a.b - b.b);

}

function debtChart(sim, base) {
  const W = 1000, H = 200, s = sim.series, b = base ? base.series : null;

  let g = '<div class="chart-wrap"><div class="chart-y">' + [1, 0.5, 0].map((f) => '<span>' + money(max * f, true) + '</span>').join('') + '</div><div><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Total debt over time">';

}

function startFresh(startS) {

  const before = st.tx.filter((t) => (t.date || '') < startS), kept = st.tx.filter((t) => (t.date || '') >= startS);
  // Work out every balance from the transactions being removed, then keep the result as the starting amount
  st.tx = before; idx();
  const banks = st.banks.map((b) => [b, bankBal(b)]), cards = st.cards.map((c) => [c, cardBal(c)]);
  const loans = st.loans.filter((l) => !usesPlans(l)).map((l) => [l, loanBal(l)]);
  const plans = st.bills.filter((b) => b.planOf).map((b) => [b, planLeft(b)]);
  banks.forEach(([b, v]) => { if (v != null) b.bal = v; });
  cards.forEach(([c, v]) => { c.opening = v; });
  loans.forEach(([l, v]) => { l.balance = v; delete l._balCache; });
  plans.forEach(([b, left]) => {
    const a = +b.amount || 0;
    if (a > 0) { const n = Math.max(1, Math.ceil(left / a - 0.0001)); b.planCount = n; b.planAdj = r2(left - a * n); }
    else b.planAdj = r2(left);
  });
  st.tx = kept; st.startDate = startS;
  closeSheet();
  commit('Fresh start from ' + dLong(pday(startS)) + '. ' + before.length + ' old transactions cleared.');
}

function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
async function saveFile(filename, data, mime) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data }); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function exportSheets() {

  // Summary

  const debtTot = debtList().reduce((s, d) => s + d.gbp, 0);

  ], [42, 22], [1]);
  // Pay cycles

  [['This cycle', P.now], ['Next cycle', P.next]].forEach(([label, list]) => list.forEach((i) => cyc.push([label, i.date, i.name, kindName(i), catText(i), i.kind === 'in' && !isBank(i.pay) ? 'Not tracked' : srcName(i.pay), r2(i.kind === 'in' ? i.gbp : -i.gbp), r2(i.amt), i.cur, status(i)])));
  addSheet('Pay cycles', cyc, [11, 13, 30, 15, 28, 18, 13, 15, 9, 12], [6, 7]);
  // Transactions
  const tx = [['Date', 'Type', 'Description', 'Category', 'Main category', 'Account', 'To account', 'Amount (£)', 'Original amount', 'Currency', 'Bill', 'Paid for someone', 'Paid back']];
  const TYPES = { expense: 'Spending', income: 'Income', transfer: 'Transfer', cardpay: 'Card payment' };
  st.tx.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.created || 0) - (a.created || 0))).forEach((t) => {
    const top = topCat(t.category);
    const acct = t.type === 'income' ? (t.into ? srcName(t.into) : '') : t.type === 'expense' ? srcName(t.pay) : srcName(t.from);
    const to = t.type === 'transfer' ? srcName(t.to) : t.type === 'cardpay' ? srcName(t.card) : '';
    const signed = t.type === 'income' ? +t.amount : t.type === 'expense' ? -t.amount : -(+t.amount || 0);
    tx.push([D(t.date), t.repayOf ? 'Paid back' : t.recv ? 'Money in' : TYPES[t.type] || t.type, t.type === 'transfer' ? (t.note || 'Transfer') : txLabel(t), t.category ? catName(t.category) : '', top ? top.name : '', acct, to, r2(signed), r2(t.type === 'transfer' ? (t.amtFrom || t.orig) : (t.orig != null ? t.orig : t.amount)), t.cur || 'GBP', t.bill && M.bill[t.bill] ? (M.bill[t.bill].planName || M.bill[t.bill].name) : '', t.owedBy || '', t.owedBy ? (t.collected ? 'Yes, ' + dShort(pday(t.collected)) : 'Not yet') : '']);
  });
  addSheet('Transactions', tx, [13, 13, 32, 22, 20, 18, 18, 13, 15, 9, 22, 16, 14], [7, 8]);
  // Accounts
  const ac = [['Account', 'Currency', 'Balance', 'Balance (£)', 'Last checked']];
  st.banks.forEach((b) => ac.push([b.name, b.cur || 'GBP', bankBal(b) == null ? '' : bankBal(b), r2(bankGbp(b)), D(b.balDate)]));
  addSheet('Accounts', ac, [22, 10, 14, 14, 14], [2, 3]);
  // Cards
  const cd = [['Card', 'Currency', 'Owed', 'Limit', 'Used', 'APR %', 'Due day', 'Minimum payment', 'Paid from']];
  st.cards.forEach((c) => { const bal = cardBal(c); cd.push([c.name, c.cur || 'GBP', bal, +c.limit || '', c.limit > 0 ? r2(bal / c.limit * 100) / 100 : '', +c.apr || '', c.dueDay || '', bal > 0.005 ? cardMin(c) : 0, c.payFrom ? srcName(c.payFrom) : '']); });
  addSheet('Cards', cd, [18, 10, 13, 12, 9, 9, 9, 17, 18], [2, 3, 7]);
  { const ws = wb.Sheets.Cards, rr = X.utils.decode_range(ws['!ref']); for (let r = 1; r <= rr.e.r; r++) { const cell = ws[X.utils.encode_cell({ r, c: 4 })]; if (cell && cell.t === 'n') cell.z = '0%'; } }
  // Debts in payoff order
  const dl = debtList().sort((a, b) => (sim.done[a.id] || 9999) - (sim.done[b.id] || 9999) || a.gbp - b.gbp);
  const de = [['Debt', 'Type', 'Currency', 'Owed', 'Owed (£)', 'APR %', 'Monthly payment', 'Payment is an estimate', 'Clear by']];
  dl.forEach((d) => de.push([d.name, d.kind === 'card' ? 'Card' : d.kind === 'bnpl' ? 'Pay later' : 'Loan', d.cur, r2(d.bal), r2(d.gbp), d.apr || 0, r2(d.pay), d.est ? 'Yes' : '', sim.done[d.id] ? monYr(monthsFromNow(sim.done[d.id])) : 'Not yet']));
  addSheet('Debts', de, [26, 11, 10, 13, 13, 8, 16, 20, 12], [3, 4, 6]);
  // Bills and money in
  const bl = [['Name', 'Type', 'Amount', 'Currency', 'How often', 'Day', 'Category', 'Account', 'Ends', 'Finished']];
  st.bills.forEach((b) => { const a = billAmt(b); bl.push([b.planName || b.name, b.planOf ? 'Pay-later plan' : 'Bill', a.unknown ? '' : r2(a.amt), b.cur || 'GBP', FREQ_LABEL[freqOf(b)], freqOf(b) === 'monthly' ? (b.due || 1) : D(b.start || b.begins), catText({ cat: b.category }), srcName(b.pay), D(b.ends), billDone(b) ? 'Yes' : '']); });
  st.incomes.forEach((x) => bl.push([x.name, 'Money in', +x.amount || 0, x.cur || 'GBP', FREQ_LABEL[freqOf(x)], freqOf(x) === 'monthly' ? (x.due || 1) : D(x.start), 'Money coming in', x.into ? srcName(x.into) : 'Not tracked', D(x.ends), x.ends && pday(x.ends) < today0() ? 'Yes' : '']));
  addSheet('Bills and money in', bl, [28, 14, 12, 10, 16, 13, 28, 18, 13, 9], [2]);
  const out = X.write(wb, { bookType: 'xlsx', type: 'array', cellDates: true });
  await saveFile('budget-' + dk(today0()) + '.xlsx', out, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast('Spreadsheet saved. Upload it to Google Drive and open it with Google Sheets.');
}

$('#importFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.tx)) throw new Error();
      if (hasData(st) && !confirm('Replace your current budget with this backup?')) return;
      st = norm(d); closeSheet(); commit('Backup imported');
    } catch (err) { toast('That file isn’t a budget backup.'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

// =============== Toast ===============
let toastTimer, toastUndo = null;
function toast(msg, undo) {
  $('#toastMsg').textContent = msg; toastUndo = undo || null; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('on'), undo ? 5000 : 2600);
}
$('#toastUndo').addEventListener('click', () => { const u = toastUndo; toastUndo = null; $('#toast').classList.remove('on'); if (u) u(); });

// =============== Events ===============
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'sheet-submit': if (sheetSubmit) sheetSubmit(); break;
    case 'sheet-danger': if (sheet._danger) sheet._danger(); break;
    case 'add': txSheet('expense'); break;
    case 'txtype': txSheet(el.dataset.v); break;
    case 'settings': settingsSheet(); break;
    case 'cview': ui.cycleView = +el.dataset.v; render(); break;
    case 'tick': tick(el.dataset.uid); break;
    case 'tick-late': tickLate(); break;
    case 'item': { const i = findItem(el.dataset.uid); if (i) itemSheet(i); break; }
    case 'bills': billsSheet(); break;
    case 'bill': if (M.bill[id]) billSheet(M.bill[id]); break;
    case 'add-bill': billSheet(null); break;
    case 'income': if (M.inc[id]) incomeSheet(M.inc[id]); break;
    case 'add-income': incomeSheet(null); break;
    case 'bank': bankSheet(M.bank[id]); break;
    case 'add-bank': bankSheet(null); break;
    case 'card': cardSheet(M.card[id]); break;
    case 'add-card': cardSheet(null); break;
    case 'checkin': checkinSheet(); break;
    case 'debt': if (el.dataset.kind === 'card') cardSheet(M.card[id]); else loanSheet(M.loan[id]); break;
    case 'add-loan': loanSheet(null); break;
    case 'add-plan': addPlanSheet(M.loan[id]); break;
    case 'strat': st.dfPlan.strategy = el.dataset.v; commit(); break;
    case 'filter': ui.actFilter = el.dataset.v; ui.actLimit = 60; render(); break;
    case 'more': ui.actLimit += 100; $('#txList').innerHTML = txListHtml(); break;
    case 'tx': { const t = st.tx.find((x) => x.id === id); if (t) txSheet(t.type, t); break; }
    case 'export': exportBackup(); break;
    case 'export-sheets': exportSheets(); break;
    case 'fresh': freshSheet(); break;
    case 'groupby': ui.groupBy = el.dataset.v; try { localStorage.setItem('budget.v2.group', ui.groupBy); } catch (er) {} render(); break;
    case 'sort': { const t = el.dataset.t, k = el.dataset.k, cur = sortOf(t); SORT[t] = cur && cur.k === k ? (cur.dir === 1 ? { k, dir: -1 } : null) : { k, dir: 1 }; if (t === 'tx') $('#txList').innerHTML = txListHtml(); else render(); break; }
    case 'remind': sendReminder(el.dataset.who); break;
    case 'shares': closeSheet(); sharesSheet(el.dataset.who); break;
    case 'share-ics': sharesIcs(el.dataset.who); break;
    case 'collect': closeSheet(); collectSheet(el.dataset.who); break;
    case 'signin': closeSheet(); signIn(); break;
    case 'signout': if (confirm('Sign out? Your budget stays on this device.')) { closeSheet(); signOut(); } break;
    case 'import': $('#importFile').click(); break;
    case 'wipe': if (confirm('Clear your whole budget? Export a backup first if you might want it back.')) { st = norm(null); closeSheet(); commit('Budget cleared'); } break;
    default: {
      const tab = el.closest('[data-tab]');
      if (tab) { ui.tab = tab.dataset.tab; try { localStorage.setItem('budget.v2.ui', JSON.stringify({ tab: ui.tab })); } catch (er) {} render(); window.scrollTo(0, 0); }
    }
  }
});
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; try { localStorage.setItem('budget.v2.ui', JSON.stringify({ tab: ui.tab })); } catch (er) {}

document.addEventListener('input', (e) => {
  const a = e.target.dataset && e.target.dataset.act;
  if (a === 'q') { ui.actQuery = e.target.value; ui.actLimit = 60; $('#txList').innerHTML = txListHtml(); }
  if (a === 'extra') { $('#extraOut').textContent = money(+e.target.value, true); }

    if (a2) { const h = a2.closest('label').querySelector('.hint'); if (h) h.textContent = oweHint(parseFloat(tot.value), a2.value === '' ? null : parseFloat(a2.value), cur ? cur.value : 'GBP'); }

});
document.addEventListener('change', (e) => {
  const a = e.target.dataset && e.target.dataset.act;
  if (a === 'extra') { st.dfPlan.extra = +e.target.value; commit(); }
  if (a === 'payinto') { st.payInto = e.target.value || undefined; commit(); }

sheet.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && sheetSubmit) { e.preventDefault(); sheetSubmit(); } });
