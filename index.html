<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3346D3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..750&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E8EBF1; --surface: #FFFFFF; --sunk: #F2F4F8; --ink: #172036; --muted: #5A6378; --faint: #8C94A6; --line: #D6DBE5;
  --route: #3346D3; --route-ink: #FFFFFF; --route-soft: #E1E5FC;
  --good: #1C7C52; --good-soft: #DCF0E5; --late: #B8283A; --late-soft: #F9E1E4; --amber: #8F5300; --amber-soft: #FBEBD3;
  --shadow: 0 1px 0 rgba(23,32,54,.04), 0 8px 24px -12px rgba(23,32,54,.18);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F121A; --surface: #181C27; --sunk: #121620; --ink: #E7EAF3; --muted: #A0A8BA; --faint: #6E768A; --line: #2A3041;
    --route: #8D99FF; --route-ink: #0F121A; --route-soft: #262C4D;
    --good: #57C892; --good-soft: #17322A; --late: #FF7383; --late-soft: #3A1C24; --amber: #F0B35A; --amber-soft: #36290F;
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F121A; --surface: #181C27; --sunk: #121620; --ink: #E7EAF3; --muted: #A0A8BA; --faint: #6E768A; --line: #2A3041;
  --route: #8D99FF; --route-ink: #0F121A; --route-soft: #262C4D;
  --good: #57C892; --good-soft: #17322A; --late: #FF7383; --late-soft: #3A1C24; --amber: #F0B35A; --amber-soft: #36290F;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 400 16px/1.45 "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  font-variation-settings: "opsz" 14;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Frame ---------- */
.app { max-width: 1080px; margin: 0 auto; padding: 14px 18px 120px; }
.top { display: flex; align-items: center; gap: 12px; padding: 4px 0 10px; }
.brand { font-size: 22px; font-weight: 700; font-variation-settings: "opsz" 48, "wdth" 85; letter-spacing: -0.02em; margin: 0; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--route); position: relative; }
.brand-mark::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--route); }
.sync { font-size: 13px; color: var(--faint); background: none; border: 0; padding: 4px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.add-btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px 0 14px; border-radius: 21px; border: 0; background: var(--route); color: var(--route-ink); font-weight: 600; }
.add-btn svg { width: 18px; height: 18px; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin: 4px 0 22px; width: max-content; }
.tabs button { border: 0; background: none; padding: 9px 16px; border-radius: 12px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.tabs button svg { width: 18px; height: 18px; display: none; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

@media (max-width: 720px) {
  .app { padding: 10px 16px 130px; }
  .top .add-btn { display: none; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; width: auto; margin: 0; border-radius: 0; border: 0;
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .tabs button { flex-direction: column; gap: 3px; font-size: 12px; padding: 6px 4px; flex: 1; border-radius: 10px; }
  .tabs button svg { display: block; width: 22px; height: 22px; }
  .tabs button[aria-selected="true"] { background: none; color: var(--route); }
  .fab { display: grid !important; }
}
.fab { display: none; position: fixed; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 21; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--route); color: var(--route-ink); place-items: center; box-shadow: var(--shadow); }
.fab svg { width: 26px; height: 26px; }

/* ---------- Shared pieces ---------- */
.big { white-space: nowrap; font-weight: 650; font-variation-settings: "opsz" 14, "wdth" 100; letter-spacing: -0.02em; line-height: 1; margin: 0; }
.big .p { font-size: .5em; letter-spacing: 0; margin-left: .02em; font-weight: 600; }
.cap { font-size: 15px; color: var(--muted); margin: 0 0 6px; }
.sub { color: var(--muted); font-size: 15px; margin: 10px 0 0; max-width: 46ch; }
.neg { color: var(--late); }
.pos { color: var(--good); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.amt { font-weight: 600; white-space: nowrap; text-align: right; }
h2.h { font-size: 19px; font-weight: 650; font-variation-settings: "opsz" 32, "wdth" 90; letter-spacing: -0.01em; margin: 0 0 4px; }
h3.h { font-size: 16px; font-weight: 650; margin: 0 0 8px; }
.panel { background: var(--surface); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); }
.flat { padding: 4px 2px; }
.rule { border-top: 1px solid var(--line); margin: 16px 0; }
.btn { height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-weight: 550; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--route); border-color: var(--route); color: var(--route-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--route); padding: 0 8px; }
.btn.danger { color: var(--late); }
.btn.small { height: 34px; font-size: 14px; padding: 0 12px; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 11px; font-size: 14px; font-weight: 550; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.pill { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.late { background: var(--late-soft); color: var(--late); }
.pill.today { background: var(--amber-soft); color: var(--amber); }
.pill.good { background: var(--good-soft); color: var(--good); }
.bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.row:last-child { border-bottom: 0; }
button.row:hover { background: var(--sunk); }
.row .nm { font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mt { font-size: 13.5px; color: var(--muted); grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rt { grid-column: 2; grid-row: 1 / span 2; text-align: right; }
.row .rt small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.empty { padding: 24px 6px; color: var(--muted); }
.sec-head { display: flex; align-items: baseline; gap: 12px; justify-content: space-between; flex-wrap: wrap; margin: 30px 0 10px; }
.sec-head:first-child { margin-top: 0; }

/* ---------- Pay cycle ---------- */
.cycle-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 28px; align-items: start; }
@media (max-width: 880px) { .cycle-grid { grid-template-columns: 1fr; gap: 22px; } }
.hero { padding: 6px 2px 0; }
.hero .big { font-size: clamp(52px, 13vw, 92px); }

.runway { position: relative; height: 54px; margin: 40px 6px 0; }
.runway .line { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.runway .done { position: absolute; left: 0; top: 18px; height: 4px; border-radius: 2px; background: var(--route); }
.runway .dot { position: absolute; top: 13px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--surface); border: 3px solid var(--faint); }
.runway .dot.paid { background: var(--route); border-color: var(--route); }
.runway .dot.late { border-color: var(--late); background: var(--late-soft); }
.runway .now { position: absolute; top: 4px; width: 0; height: 32px; border-left: 2px solid var(--ink); }
.runway .now span { position: absolute; top: -18px; left: 0; transform: translateX(-50%); font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.runway .end { position: absolute; top: 34px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.runway .end.r { right: 0; text-align: right; }
.runway .cap-end { position: absolute; top: 9px; width: 22px; height: 22px; border-radius: 50%; background: var(--route); right: -11px; display: grid; place-items: center; color: var(--route-ink); font-size: 12px; font-weight: 700; }

.callout { display: flex; gap: 12px; align-items: flex-start; background: var(--late-soft); color: var(--ink); border-radius: 16px; padding: 14px 16px; margin-top: 22px; }
.callout b { color: var(--late); }
.callout .btn { margin-left: auto; flex: none; }
.cat-h { display: flex; align-items: center; gap: 10px; margin: 24px 6px 10px; }
.cat-h:first-child { margin-top: 0; }
.cat-h .sw { width: 12px; height: 12px; border-radius: 4px; align-self: center; flex: none; }
.cat-h h3 { margin: 0; }
.cat-h .amt { margin-left: auto; font-size: 17px; }
.cat-h .amt small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.route-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.owed { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--route-soft); color: var(--ink); border: 0; border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
.owed b { display: block; font-weight: 650; }
.owed small { display: block; font-size: 14px; color: var(--muted); }
.owed .go { margin-left: auto; flex: none; background: var(--route); color: var(--route-ink); border-radius: 18px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
.collect-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 15.5px; }
.collect-row input { width: 22px; height: 22px; accent-color: var(--route); }
.collect-row small { display: block; color: var(--muted); font-size: 13.5px; }

.route-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 34px 0 12px; }
.route { list-style: none; margin: 0; padding: 6px 0; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); }
.stop { position: relative; display: grid; grid-template-columns: 58px 26px minmax(0, 1fr) auto 48px; align-items: center; min-height: 52px; padding: 0 10px 0 6px; }
.stop::before { content: ""; position: absolute; left: 76px; top: 0; bottom: 0; width: 3px; background: var(--route-soft); }
.stop:first-child::before { top: 50%; }
.stop:last-child::before { bottom: 50%; }
.stop .date { font-size: 13.5px; color: var(--muted); text-align: right; padding-right: 12px; line-height: 1.15; }
.stop .date b { display: block; font-size: 18px; color: var(--ink); font-weight: 650; font-variation-settings: "opsz" 14, "wdth" 100; }
.cat-chip { display: inline-flex; align-items: center; gap: 5px; flex: none; color: var(--ink); font-weight: 550; font-size: 12.5px; padding: 1px 8px 1px 6px; border-radius: 10px; }
.cat-chip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.stop .node { position: relative; z-index: 1; justify-self: center; width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--route); }
.stop.paid .node { background: var(--route); }
.stop.late .node { border-color: var(--late); background: var(--late-soft); }
.stop .body { min-width: 0; padding: 10px 10px 10px 8px; background: none; border: 0; text-align: left; border-radius: 12px; display: flex; align-items: center; gap: 8px; }
.stop .body .pill { flex: none; font-size: 11.5px; padding: 1px 7px; }
.stop .body { position: relative; }
.stop .body[data-tip]::after { content: attr(data-tip); position: absolute; left: 8px; top: calc(100% - 2px); z-index: 30; min-width: 180px; max-width: 300px; padding: 9px 12px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 450; line-height: 1.45; white-space: pre-line; box-shadow: var(--shadow); pointer-events: none; opacity: 0; transform: translateY(-4px); transition: opacity .12s ease, transform .12s ease; visibility: hidden; }
@media (hover: hover) { .stop .body[data-tip]:hover::after { opacity: 1; transform: none; visibility: visible; transition-delay: .25s; } }
.stop .body[data-tip]:focus-visible::after { opacity: 1; transform: none; visibility: visible; }
.mini-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 6px 10px; font-size: 13px; color: var(--muted); }
.mini-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mini-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.stop .body:hover { background: var(--sunk); }
.stop .nm { font-weight: 560; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
.stop .mt { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; overflow: hidden; white-space: nowrap; }
.stop .mt > span { overflow: hidden; text-overflow: ellipsis; }
.stop .amt { padding-left: 8px; }
.stop.paid .nm, .stop.paid .amt, .stop.assumed .nm, .stop.assumed .amt { color: var(--muted); }
.stop.assumed .node { border-color: var(--route); background: var(--route-soft); }
.stop.paid .amt { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--faint); }
.tick { justify-self: end; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; }
.tick:hover { border-color: var(--route); color: var(--route); }
.tick svg { width: 18px; height: 18px; }
@media (max-width: 520px) {
  .stop { grid-template-columns: 44px 22px minmax(0, 1fr) auto 42px; padding: 0 8px 0 2px; }
  .stop::before { left: 55px; }
  .stop .date b { font-size: 16px; }
  .stop .date { padding-right: 8px; font-size: 12.5px; }
  .stop .body { padding: 9px 6px; }
  .stop .amt { font-size: 15px; }
  .stop.marker .lbl, .stop.group .lbl { padding-left: 6px; }
  .stop.group .lbl { flex-wrap: wrap; gap: 6px; }
}
.stop.paid .tick { background: var(--route); border-color: var(--route); color: var(--route-ink); }
.stop.marker { min-height: 46px; }
.stop.marker .node { width: 21px; height: 21px; background: var(--ink); border: 4px solid var(--bg); box-shadow: 0 0 0 2px var(--ink); }
.stop.marker .lbl { grid-column: 3 / span 3; font-weight: 650; padding-left: 8px; }
.stop.marker .lbl span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.stop.pay .node { width: 24px; height: 24px; background: var(--route); border: 0; display: grid; place-items: center; color: var(--route-ink); font-size: 13px; font-weight: 700; }
.stop.dayhead { min-height: 46px; }
.stop.dayhead .node { width: 15px; height: 15px; border: 3px solid var(--ink); background: var(--surface); }
.stop.dayhead .lbl { grid-column: 3; padding-left: 8px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.stop.dayhead .lbl span { font-weight: 400; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop.dayhead .amt { grid-column: 4; }
.stop.dayhead .amt small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.stop.inday { min-height: 46px; }
.stop.inday .node { width: 10px; height: 10px; border-width: 2px; }
.stop.daystart:not(:first-child)::after { content: ""; position: absolute; left: 92px; right: 14px; top: 0; height: 1px; background: var(--line); }
@media (max-width: 520px) { .stop.daystart:not(:first-child)::after { left: 68px; } }
.stop.group { min-height: 40px; }
.stop.group .lbl { grid-column: 3 / span 3; justify-content: flex-start; font-size: 14px; color: var(--late); font-weight: 600; padding-left: 8px; display: flex; align-items: center; gap: 10px; }
.stop.group .node { width: 7px; height: 7px; border: 0; background: var(--route-soft); }

.side { display: grid; gap: 22px; }
.plan h2.h { margin-bottom: 14px; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; gap: 10px; }
.sum-line.total { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; font-weight: 650; font-size: 18px; }
.moves { margin-top: 18px; }
.move { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.move .mt { font-size: 13.5px; color: var(--muted); }
.legend { display: grid; gap: 6px; margin-top: 14px; }
.legend div { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14.5px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; }
.inline-select { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--amber-soft); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; margin-top: 14px; }
.inline-select select { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }

/* ---------- Accounts / Debt / Activity ---------- */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
@media (max-width: 880px) { .two { grid-template-columns: 1fr; } }
.lead { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 22px; }
.lead .big { font-size: clamp(46px, 11vw, 76px); }
.util { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.util .bar { grid-column: 1 / -1; height: 6px; }
.stale { color: var(--amber); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 12px; font-family: inherit; }
.ctrl { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; margin: 4px 0 16px; }
.slider { display: flex; align-items: center; gap: 12px; }
.slider input { width: 180px; accent-color: var(--route); }
.payoff-order { counter-reset: n; }
.search { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.search input { flex: 1 1 220px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); padding: 0 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day-h { font-size: 13.5px; color: var(--muted); font-weight: 600; padding: 18px 4px 4px; }

/* ---------- Sheet ---------- */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(540px, 100vw); max-height: min(88vh, 900px); border-radius: 24px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog.sheet::backdrop { background: rgba(10, 14, 26, .45); }
@media (max-width: 600px) {
  dialog.sheet { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: 24px 24px 0 0; max-height: 92vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.sheet-in { padding: 22px 22px 22px; overflow-y: auto; max-height: inherit; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sheet-head h2 { font-size: 22px; font-weight: 650; font-variation-settings: "opsz" 40, "wdth" 88; margin: 0; letter-spacing: -0.01em; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 12px; }
.fields .full { grid-column: 1 / -1; }
.fields label { display: grid; gap: 5px; font-size: 14px; color: var(--muted); font-weight: 500; }
.fields input, .fields select { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); padding: 0 12px; color: var(--ink); font-size: 16px; width: 100%; min-width: 0; }

.sheet .seg button { flex: 1; padding: 8px 4px; white-space: nowrap; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 50; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 10px 10px 18px; display: flex; gap: 14px; align-items: center; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); font-size: 15px; }

@media (min-width: 721px) { .toast { bottom: 28px; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
(function () {
'use strict';
// =============== Utilities ===============
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = (n) => Math.round((+n || 0) * 100) / 100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, '0');
const dk = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ymOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const pday = (s) => { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const dShort = (d) => d.getDate() + ' ' + MON[d.getMonth()];
const dLong = (d) => DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
const monYr = (d) => MON[d.getMonth()] + ' ' + d.getFullYear();
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PALETTE = ['#3346D3', '#C0662B', '#8B4FB8', '#2B8C9A', '#B8283A', '#7A7F2E', '#B8901A', '#5A6378']; // green is kept for money coming in

const nfCache = {};
function fmt(cur, n, whole) {
  cur = cur || 'GBP';
  const k = cur + (whole ? 'w' : '');
  if (!nfCache[k]) nfCache[k] = new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol', minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 });
  return nfCache[k].format(whole ? Math.round(n) : r2(n)).replace('-', '−');
}
const money = (n, whole) => fmt('GBP', n, whole);
function bigMoney(n) {
  const s = fmt('GBP', Math.abs(n)), i = s.lastIndexOf('.');
  return (n < -0.004 ? '−' : '') + esc(s.slice(0, i)) + '<span class="p">' + esc(s.slice(i)) + '</span>';
}

// =============== State ===============
const DEF_RATE = 1 / 85;
let st = norm(null);
let ui = { tab: 'cycle', cycleView: 0, actFilter: 'all', actQuery: '', actLimit: 60 };
try { const u = JSON.parse(localStorage.getItem('budget.v2.ui')); if (u && u.tab) ui.tab = u.tab; } catch (e) {}
try { ui.groupBy = localStorage.getItem('budget.v2.group') || 'date'; } catch (e) { ui.groupBy = 'date'; }

function norm(s) {
  s = s && typeof s === 'object' ? JSON.parse(JSON.stringify(s)) : {};
  ['categories', 'tx', 'cards', 'bills', 'banks', 'loans', 'incomes'].forEach((k) => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.rate || !(s.rate.value > 0)) s.rate = { value: DEF_RATE, manual: true };
  if (!(s.payday >= 1 && s.payday <= 31)) s.payday = 28;
  if (!s.dfPlan) s.dfPlan = { strategy: 'snowball', extra: 0 };
  s.currency = 'GBP';
  return s;
}
const hasData = (s) => !!(s.tx.length || s.banks.length || s.bills.length || s.cards.length || s.loans.length);

// Lookups, rebuilt after every change
let M = {};
function idx() {
  M = { bank: {}, card: {}, loan: {}, cat: {}, bill: {}, inc: {}, memo: new Map() };
  st.incomes.forEach((x) => (M.inc[x.id] = x));
  st.banks.forEach((b) => (M.bank[b.id] = b));
  st.cards.forEach((c) => (M.card[c.id] = c));
  st.loans.forEach((l) => (M.loan[l.id] = l));
  st.categories.forEach((c) => (M.cat[c.id] = c));
  st.bills.forEach((b) => (M.bill[b.id] = b));
}
function memo(key, fn) { if (!M.memo.has(key)) M.memo.set(key, fn()); return M.memo.get(key); }

// =============== Money engine ===============
function rateOf(cur) { if (!cur || cur === 'GBP') return 1; if (cur === 'PHP') return st.rate.value || DEF_RATE; return 1; }
const toGbp = (cur, n) => n * rateOf(cur);
const fromGbp = (cur, g) => g / rateOf(cur);
function inCur(cur, t) { cur = cur || 'GBP'; if ((t.cur || 'GBP') === cur) return +t.orig || +t.amount || 0; return cur === 'GBP' ? (+t.amount || 0) : fromGbp(cur, +t.amount || 0); }
function srcName(id) {
  if (!id || id === 'cash') return 'Cash';
  if (M.bank[id]) return M.bank[id].name;
  if (M.card[id]) return M.card[id].name + ' card';
  if (M.loan[id]) return M.loan[id].name;
  return 'Unknown account';
}
const isCard = (id) => !!M.card[id];
const isBank = (id) => !!M.bank[id];
function catName(id) { const c = M.cat[id]; return c ? c.name : 'Uncategorised'; }
function topCat(id) { let c = M.cat[id], n = 0; while (c && c.parent && M.cat[c.parent] && n++ < 5) c = M.cat[c.parent]; return c || null; }

// Banks: the balance you last entered, plus anything logged after it
function bankDelta(b, t) {
  const bc = b.cur || 'GBP';
  if (t.type === 'income' && t.into === b.id) return inCur(bc, t);
  if (t.type === 'expense' && t.pay === b.id) return -inCur(bc, t);
  if (t.type === 'cardpay' && t.from === b.id) return -inCur(bc, t);
  if (t.type === 'transfer') { if (t.from === b.id) return -(+t.amtFrom || 0); if (t.to === b.id) return +t.amtTo || 0; }
  return 0;
}
function bankCounts(b, t) { if (!b.balDate) return true; if (t.date > b.balDate) return true; return t.date === b.balDate && (t.created || 0) > (b.balAt || 0); }
function bankBal(b) {
  return memo('bank' + b.id, () => {
    if (b.bal == null) return null;
    let v = +b.bal;
    st.tx.forEach((t) => { const d = bankDelta(b, t); if (d && bankCounts(b, t)) v += d; });
    return r2(v);
  });
}
const bankGbp = (b) => toGbp(b.cur || 'GBP', bankBal(b) || 0);

// Cards: what you owed when you added it, plus spending on it, minus payments
function cardBal(c) {
  return memo('card' + c.id, () => {
    const cc = c.cur || 'GBP'; let v = +c.opening || 0;
    st.tx.forEach((t) => {
      if (t.type === 'expense' && t.pay === c.id) v += inCur(cc, t);
      if (t.type === 'cardpay' && t.card === c.id) v -= (cc !== 'GBP' && t.cardAmt != null) ? +t.cardAmt : inCur(cc, t);
    });
    return r2(v);
  });
}
function cardMin(c) {
  const bal = cardBal(c); if (bal <= 0.005) return 0;
  if (c.minPay > 0) return Math.min(c.minPay, bal);
  const floor = (c.cur || 'GBP') === 'PHP' ? 500 : 5;
  return r2(Math.min(bal, Math.max(floor, Math.ceil(bal * (0.01 + (c.apr || 0) / 1200) * 100) / 100)));
}

// Loans and buy-now-pay-later
const usesPlans = (l) => l && l.kind === 'bnpl' && l.plansOn;
const planBills = (l) => st.bills.filter((b) => b.planOf === l.id);
const billPayments = (b) => st.tx.filter((t) => t.type === 'expense' && t.bill === b.id);
function planLeft(b) {
  return memo('plan' + b.id, () => {
    const tot = (+b.amount || 0) * Math.max(1, b.planCount || 1) + (+b.planAdj || 0);
    const paid = billPayments(b).reduce((s, t) => s + inCur(b.cur, t), 0);
    return Math.max(0, r2(tot - paid));
  });
}
function loanBal(l) {
  return memo('loan' + l.id, () => {
    if (usesPlans(l)) return r2(planBills(l).reduce((s, b) => s + planLeft(b), 0));
    let bal = +l.balance || 0; const r = (l.apr || 0) / 1200;
    st.tx.filter((t) => {
      if (t.type !== 'expense') return false;
      const isPay = t.loan === l.id || (l.billId && t.bill === l.billId), isBuy = l.kind === 'bnpl' && t.pay === l.id;
      if (!isPay && !isBuy) return false;
      return (t.created || new Date(t.date + 'T23:59:59').getTime()) > (l.asOf || 0);
    }).sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((t) => {
      const a = inCur(l.cur, t), isPay = t.loan === l.id || (l.billId && t.bill === l.billId);
      if (!isPay) { bal += a; return; }
      bal = Math.max(0, bal + bal * r - a);
    });
    return r2(bal);
  });
}
const loanForBill = (b) => st.loans.find((l) => l.billId && l.billId === b.id);
function loanMonthly(l) {
  // returns { amt (loan currency), est }
  if (usesPlans(l)) {
    const t0 = today0();
    const amt = planBills(l).filter((b) => planLeft(b) > 0.005).reduce((s, b) => s + Math.min(+b.amount || 0, planLeft(b)) * (PERM[freqOf(b)] || 1), 0);
    return { amt: r2(amt), est: false };
  }
  const bal = loanBal(l); if (bal <= 0.005) return { amt: 0, est: false };
  if (l.payment > 0) return { amt: Math.min(l.payment, bal), est: false };
  const b = M.bill[l.billId];
  if (b && b.amount > 0) return { amt: Math.min(b.amount, bal), est: false };
  const hist = b ? billPayments(b).sort((a, c) => (c.date < a.date ? -1 : 1)).slice(0, 3) : [];
  if (hist.length) return { amt: Math.min(bal, r2(hist.reduce((s, t) => s + inCur(l.cur, t), 0) / hist.length)), est: true };
  const floor = (l.cur || 'GBP') === 'PHP' ? 500 : 5;
  return { amt: r2(Math.min(bal, Math.max(floor, bal * 0.03))), est: true };
}

// =============== Bills and dates ===============
const FD = { weekly: 7, '2weekly': 14, '4weekly': 28 }, FM = { quarterly: 3, '6monthly': 6, yearly: 12 };
const PERM = { monthly: 1, weekly: 52 / 12, '2weekly': 26 / 12, '4weekly': 13 / 12, quarterly: 1 / 3, '6monthly': 1 / 6, yearly: 1 / 12, once: 0 };
const FREQ_LABEL = { monthly: 'Monthly', weekly: 'Weekly', '2weekly': 'Every 2 weeks', '4weekly': 'Every 4 weeks', quarterly: 'Every 3 months', '6monthly': 'Every 6 months', yearly: 'Yearly', once: 'Once' };
const freqOf = (b) => (PERM[b.freq] != null ? b.freq : 'monthly');
function addMonthsClamped(base, n, day) {
  let y = base.getFullYear(), m = base.getMonth() + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return new Date(y, m, Math.min(day, dim(y, m)));
}
function occurrences(b, from, to) {
  const out = [], f = freqOf(b);
  if (b.begins) { const bg = pday(b.begins); if (bg > from) from = bg; if (from >= to) return out; }
  if (b.ends) { const en = addDays(pday(b.ends), 1); if (en < to) to = en; if (from >= to) return out; }
  if (f === 'monthly') {
    let cur = new Date(from.getFullYear(), from.getMonth(), 1);
    while (cur < to) {
      const d = new Date(cur.getFullYear(), cur.getMonth(), Math.min(b.due || 1, dim(cur.getFullYear(), cur.getMonth())));
      if (d >= from && d < to) out.push({ date: d, key: ymOf(d) });
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    }
    return out;
  }
  const startS = b.start || b.begins; if (!startS) return out;
  const a = pday(startS);
  if (f === 'once') { if (a >= from && a < to) out.push({ date: a, key: dk(a) }); return out; }
  if (FD[f]) {
    const step = FD[f], n = from > a ? Math.ceil(daysBetween(a, from) / step) : 0;
    let x = addDays(a, n * step);
    while (x < to) { if (x >= from) out.push({ date: x, key: dk(x) }); x = addDays(x, step); }
    return out;
  }
  const ms = FM[f];
  for (let k = 0; k < 600; k++) { const d = addMonthsClamped(a, k * ms, a.getDate()); if (d >= to) break; if (d >= from) out.push({ date: d, key: dk(d) }); }
  return out;
}
function occPayment(b, key) {
  return st.tx.find((t) => t.bill === b.id && t.type === 'expense' && (t.billOcc ? t.billOcc === key : (t.billMonth || t.date.slice(0, 7)) === key));
}
function billDone(b) {
  if (b.planOf) return planLeft(b) <= 0.005;
  const l = loanForBill(b);
  return !!(l && !usesPlans(l) && loanBal(l) <= 0.005);
}
function billAmt(b) {
  // { amt in bill currency, est, unknown }
  const cur = b.cur || 'GBP';
  if (b.planOf) return { amt: Math.min(+b.amount || 0, planLeft(b)), est: false };
  const l = loanForBill(b);
  if (b.amount > 0) { if (l && !usesPlans(l)) return { amt: Math.min(b.amount, fromGbp(cur, toGbp(l.cur || 'GBP', loanBal(l)))), est: false }; return { amt: +b.amount, est: false }; }
  if (l) { const m = loanMonthly(l); return { amt: fromGbp(cur, toGbp(l.cur || 'GBP', m.amt)), est: true }; }
  const hist = billPayments(b).sort((a, c) => (c.date < a.date ? -1 : 1)).slice(0, 3);
  if (hist.length) return { amt: r2(hist.reduce((s, t) => s + inCur(cur, t), 0) / hist.length), est: true };
  return { amt: 0, est: true, unknown: true };
}
function cardPaid(c, key) { return st.tx.find((t) => t.type === 'cardpay' && t.card === c.id && t.cardMin === key); }

// Every payment in a date range: bills, plan instalments and card minimums
function itemsIn(from, to) {
  return memo('items' + dk(from) + dk(to), () => {
    if (st.startDate) { const sd = pday(st.startDate); if (from < sd) from = sd; if (from >= to) return []; }
    const out = [];
    st.bills.forEach((b) => {
      const done = billDone(b);
      occurrences(b, from, to).forEach((o) => {
        const p = occPayment(b, o.key);
        if (!p && done) return;
        const cur = b.cur || 'GBP', a = p ? { amt: inCur(cur, p), est: false } : billAmt(b);
        const owner = b.planOf ? M.loan[b.planOf] : null;
        out.push(withAssumed({ kind: 'bill', uid: b.id + '|' + o.key, ref: b, key: o.key, date: o.date, name: b.planName || b.name, owner: owner ? owner.name : '', cur, amt: r2(a.amt), est: a.est, unknown: !p && a.unknown, gbp: r2(toGbp(cur, a.amt)), pay: p ? p.pay : b.pay, cat: b.category, paid: p || null }));
      });
    });
    st.cards.forEach((c) => {
      if (!c.dueDay) return;
      let cur = new Date(from.getFullYear(), from.getMonth(), 1);
      while (cur < to) {
        const d = new Date(cur.getFullYear(), cur.getMonth(), Math.min(c.dueDay, dim(cur.getFullYear(), cur.getMonth()))), key = ymOf(d);
        cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);

  const loans = st.loans.filter((l) => !usesPlans(l)).map((l) => [l, loanBal(l)]);
  const plans = st.bills.filter((b) => b.planOf).map((b) => [b, planLeft(b)]);
  banks.forEach(([b, v]) => { if (v != null) b.bal = v; });
  cards.forEach(([c, v]) => { c.opening = v; });
  loans.forEach(([l, v]) => { l.balance = v; delete l._balCache; });
  plans.forEach(([b, left]) => {
    const a = +b.amount || 0;
    if (a > 0) { const n = Math.max(1, Math.ceil(left / a - 0.0001)); b.planCount = n; b.planAdj = r2(left - a * n); }
    else b.planAdj = r2(left);
  });
  st.tx = kept; st.startDate = startS;
  closeSheet();
  commit('Fresh start from ' + dLong(pday(startS)) + '. ' + before.length + ' old transactions cleared.');
}

async function exportBackup() {
  const data = JSON.stringify(Object.assign({}, st, { lastBackup: Date.now() }), null, 2);
  const filename = 'budget-backup-' + dk(today0()) + '.json';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.tx)) throw new Error();
      if (hasData(st) && !confirm('Replace your current budget with this backup?')) return;
      st = norm(d); closeSheet(); commit('Backup imported');
    } catch (err) { toast('That file isn’t a budget backup.'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

// =============== Toast ===============
let toastTimer, toastUndo = null;
function toast(msg, undo) {
  $('#toastMsg').textContent = msg; toastUndo = undo || null; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('on'), undo ? 5000 : 2600);
}
$('#toastUndo').addEventListener('click', () => { const u = toastUndo; toastUndo = null; $('#toast').classList.remove('on'); if (u) u(); });

// =============== Events ===============
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'sheet-submit': if (sheetSubmit) sheetSubmit(); break;
    case 'sheet-danger': if (sheet._danger) sheet._danger(); break;
    case 'add': txSheet('expense'); break;
    case 'txtype': txSheet(el.dataset.v); break;
    case 'settings': settingsSheet(); break;
    case 'cview': ui.cycleView = +el.dataset.v; render(); break;
    case 'tick': tick(el.dataset.uid); break;
    case 'tick-late': tickLate(); break;
    case 'item': { const i = findItem(el.dataset.uid); if (i) itemSheet(i); break; }
    case 'bills': billsSheet(); break;
    case 'bill': if (M.bill[id]) billSheet(M.bill[id]); break;
    case 'add-bill': billSheet(null); break;
    case 'income': if (M.inc[id]) incomeSheet(M.inc[id]); break;
    case 'add-income': incomeSheet(null); break;
    case 'bank': bankSheet(M.bank[id]); break;
    case 'add-bank': bankSheet(null); break;
    case 'card': cardSheet(M.card[id]); break;
    case 'add-card': cardSheet(null); break;
    case 'checkin': checkinSheet(); break;
    case 'debt': if (el.dataset.kind === 'card') cardSheet(M.card[id]); else loanSheet(M.loan[id]); break;
    case 'add-loan': loanSheet(null); break;
    case 'add-plan': addPlanSheet(M.loan[id]); break;
    case 'strat': st.dfPlan.strategy = el.dataset.v; commit(); break;
    case 'filter': ui.actFilter = el.dataset.v; ui.actLimit = 60; render(); break;
    case 'more': ui.actLimit += 100; $('#txList').innerHTML = txListHtml(); break;
    case 'tx': { const t = st.tx.find((x) => x.id === id); if (t) txSheet(t.type, t); break; }
    case 'export': exportBackup(); break;
    case 'fresh': freshSheet(); break;
    case 'groupby': ui.groupBy = el.dataset.v; try { localStorage.setItem('budget.v2.group', ui.groupBy); } catch (er) {} render(); break;
    case 'collect': closeSheet(); collectSheet(el.dataset.who); break;
    case 'signin': closeSheet(); signIn(); break;
    case 'signout': if (confirm('Sign out? Your budget stays on this device.')) { closeSheet(); signOut(); } break;
    case 'import': $('#importFile').click(); break;
    case 'wipe': if (confirm('Clear your whole budget? Export a backup first if you might want it back.')) { st = norm(null); closeSheet(); commit('Budget cleared'); } break;
    default: {
      const tab = el.closest('[data-tab]');
      if (tab) { ui.tab = tab.dataset.tab; try { localStorage.setItem('budget.v2.ui', JSON.stringify({ tab: ui.tab })); } catch (er) {} render(); window.scrollTo(0, 0); }
    }
  }
});
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; try { localStorage.setItem('budget.v2.ui', JSON.stringify({ tab: ui.tab })); } catch (er) {}
  render(); window.scrollTo(0, 0);
});
document.addEventListener('input', (e) => {
  const a = e.target.dataset && e.target.dataset.act;
  if (a === 'q') { ui.actQuery = e.target.value; ui.actLimit = 60; $('#txList').innerHTML = txListHtml(); }
  if (a === 'extra') { $('#extraOut').textContent = money(+e.target.value, true); }
});
document.addEventListener('change', (e) => {
  const a = e.target.dataset && e.target.dataset.act;
  if (a === 'extra') { st.dfPlan.extra = +e.target.value; commit(); }
  if (a === 'payinto') { st.payInto = e.target.value || undefined; commit(); }
  if (e.target.id === 'f_owe') { const n = document.getElementById('f_owedBy'); if (n) { n.closest('label').hidden = !e.target.checked; if (e.target.checked && !n.value) n.value = 'Wife'; } }
  if (a === 'profile') { closeSheet(); switchProfile(e.target.value); }
});
sheet.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && sheetSubmit) { e.preventDefault(); sheetSubmit(); } });

// =============== Start ===============
applyTheme();
st = loadLocal();
idx(); noteSeen();
render();
connect();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
// Roll the view over at midnight
let lastDay = dk(today0());
setInterval(() => { if (dk(today0()) !== lastDay) { lastDay = dk(today0()); idx(); render(); } }, 60000);
})();
</script>
